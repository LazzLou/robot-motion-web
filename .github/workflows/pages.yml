name: Deploy robot app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/geometry.js
      - name: Test geometry and collision detection
        run: npm test
      - name: Verify public file allowlist
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readdir, lstat} from 'node:fs/promises';
          const allowed = ['app.js', 'geometry.js', 'index.html', 'style.css'];
          assert.deepEqual((await readdir('dist')).sort(), allowed, 'Only the four application files may be published');
          for (const name of allowed) {
            assert.ok((await lstat(`dist/${name}`)).isFile(), `${name} must be a regular file, not a directory or symlink`);
          }
          JS
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static application
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
